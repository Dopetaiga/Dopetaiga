<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Dopetaiga banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#121b34"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f778ba" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f778ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="18" height="18" rx="4" fill="#1b2233"/>
    </pattern>
  </defs>
  <style>
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(90px,30px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-80px,-20px); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-30px); } }
    @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
    .b1 { animation: drift1 14s ease-in-out infinite; }
    .b2 { animation: drift2 17s ease-in-out infinite; }
    .b3 { animation: drift3 20s ease-in-out infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#tg)"/>

  <g class="b1"><ellipse cx="220" cy="90" rx="330" ry="210" fill="url(#b1)"/></g>
  <g class="b2"><ellipse cx="980" cy="250" rx="360" ry="220" fill="url(#b2)"/></g>
  <g class="b3"><ellipse cx="620" cy="40" rx="280" ry="170" fill="url(#b3)"/></g>

  <rect x="0" y="268" width="1200" height="72" fill="url(#grid)" opacity="0.55"/>
  <g>
    <rect x="108" y="274" width="18" height="18" rx="4" fill="#006d32"/>
    <rect x="134" y="300" width="18" height="18" rx="4" fill="#39d353" class="pulse"/>
    <rect x="186" y="274" width="18" height="18" rx="4" fill="#0e4429"/>
    <rect x="264" y="300" width="18" height="18" rx="4" fill="#26a641"/>
    <rect x="316" y="274" width="18" height="18" rx="4" fill="#006d32"/>
    <rect x="420" y="300" width="18" height="18" rx="4" fill="#0e4429"/>
    <rect x="472" y="274" width="18" height="18" rx="4" fill="#39d353"/>
    <rect x="576" y="300" width="18" height="18" rx="4" fill="#26a641"/>
    <rect x="628" y="274" width="18" height="18" rx="4" fill="#0e4429"/>
    <rect x="732" y="300" width="18" height="18" rx="4" fill="#39d353" class="pulse"/>
    <rect x="784" y="274" width="18" height="18" rx="4" fill="#006d32"/>
    <rect x="888" y="300" width="18" height="18" rx="4" fill="#26a641"/>
    <rect x="940" y="274" width="18" height="18" rx="4" fill="#0e4429"/>
    <rect x="1066" y="300" width="18" height="18" rx="4" fill="#006d32"/>
    <rect x="1118" y="274" width="18" height="18" rx="4" fill="#26a641"/>
  </g>

  <text x="60" y="84" font-size="34" fill="#58a6ff" opacity="0.25" font-family="Consolas,monospace">{ }</text>
  <text x="1092" y="292" font-size="34" fill="#f778ba" opacity="0.25" font-family="Consolas,monospace">&lt;/&gt;</text>
  <text x="70" y="236" font-size="30" fill="#a371f7" opacity="0.22" font-family="Consolas,monospace">λ</text>
  <text x="1104" y="84" font-size="30" fill="#3fb950" opacity="0.30" font-family="Consolas,monospace">★</text>

  <text x="600" y="168" text-anchor="middle" font-size="76" font-weight="700" fill="url(#tg)" letter-spacing="2">Dopetaiga</text>
  <text x="600" y="222" text-anchor="middle" font-size="22" fill="#8b949e" font-family="JetBrains Mono,Consolas,Courier New,monospace">TypeScript · Python · Web · Automation</text>
  <rect x="460" y="244" width="280" height="4" rx="2" fill="url(#bar)"/>
</svg>
